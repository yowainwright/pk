codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 75%
        threshold: 0%

comment:
  layout: "header, diff, flags"
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "tests/**/*"
