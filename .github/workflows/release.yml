name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Draft GitHub release tag to validate and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          WORKFLOW_REF: ${{ github.ref }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "release.yml must run from main" >&2
            exit 1
          fi
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG_NAME" =~ $pattern ]]; then
            echo "tag_name must be a v-prefixed semantic version" >&2
            exit 1
          fi

      - name: Verify Homebrew credentials
        if: ${{ !contains(inputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          can_push="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          if [[ "$can_push" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot update yowainwright/homebrew-tap" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh
          curl -fsSLo shellcheck-legibility.tar.gz \
            https://github.com/yowainwright/shellcheck_legibility/releases/download/v0.2.1/shellcheck-legibility-0.2.1.tar.gz
          echo "137942db1000e72ce8f8e2fbe8c10e334c70dc554ad2ef08aa49f0778f0302c0  shellcheck-legibility.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck-legibility"
          tar -xzf shellcheck-legibility.tar.gz \
            -C "$RUNNER_TEMP/shellcheck-legibility" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/shellcheck-legibility/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: sh scripts/lint.sh --all

      - name: Run tests
        run: go test -race ./...

      - name: Run CLI end-to-end tests
        run: go test -tags=e2e ./tests/e2e -v

      - name: Run isolated process end-to-end tests
        run: ./tests/e2e/test-process-cleanup.sh

      - name: Run release script tests
        run: |
          bash tests/scripts/release_test.sh
          bash tests/scripts/lint_test.sh

      - name: Run security scans
        run: sh scripts/security.sh

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: release --snapshot --clean --skip=sign

      - name: Verify snapshot
        run: sh scripts/verify-release-assets.sh

  build:
    name: Build Signed Assets
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build and upload draft assets
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Verify and Publish Draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          mkdir assets
          gh release download "$TAG_NAME" --dir assets --pattern 'pk-*' --pattern 'SHA256SUMS*'

      - name: Verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
          test "$is_draft" = "true"
          test -s assets/SHA256SUMS.bundle
          sh scripts/verify-release-assets.sh assets

      - name: Verify checksum signature
        run: sh scripts/verify-checksum-signature.sh assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$TAG_NAME" == *-* ]]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
          fi

  update-homebrew:
    name: Open Homebrew Formula PR
    if: ${{ !contains(inputs.tag_name, '-') }}
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
