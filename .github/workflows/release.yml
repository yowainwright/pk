name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Draft GitHub release tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag_name }}
        run: test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = "true"

      - name: Run tests
        run: go test -race ./...

      - name: Run CLI E2E tests
        run: go test -tags=e2e ./tests/e2e -v

      - name: Run isolated process cleanup E2E
        run: ./tests/e2e/test-process-cleanup.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"

      - name: Build binaries
        env:
          VERSION: ${{ inputs.tag_name }}
        run: |
          mkdir -p bin
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=$VERSION" -o bin/pk-darwin-arm64 ./cmd/pk
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=$VERSION" -o bin/pk-darwin-amd64 ./cmd/pk
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=$VERSION" -o bin/pk-linux-arm64 ./cmd/pk
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=$VERSION" -o bin/pk-linux-amd64 ./cmd/pk

      - name: Create checksums
        working-directory: bin
        run: sha256sum pk-* > SHA256SUMS

      - name: Verify binary version
        env:
          VERSION: ${{ inputs.tag_name }}
        run: test "$(./bin/pk-linux-amd64 --version)" = "pk $VERSION"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag_name }}
        run: gh release upload "$VERSION" bin/* --clobber

  publish:
    name: Publish Draft
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag_name }}
        run: |
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = "true"
          ASSETS="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
          for ASSET in pk-darwin-arm64 pk-darwin-amd64 pk-linux-arm64 pk-linux-amd64 SHA256SUMS; do
            grep -Fxq "$ASSET" <<< "$ASSETS"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag_name }}
        run: gh release edit "$VERSION" --draft=false --latest

  update-homebrew:
    name: Update Homebrew
    needs: publish
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
