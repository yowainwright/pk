name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Draft GitHub release tag to validate and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          WORKFLOW_REF: ${{ github.ref }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "release.yml must run from main" >&2
            exit 1
          fi
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG_NAME" =~ $pattern ]]; then
            echo "tag_name must be a v-prefixed semantic version" >&2
            exit 1
          fi

      - name: Verify Homebrew credentials
        if: ${{ !contains(inputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          can_push="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          if [[ "$can_push" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot update yowainwright/homebrew-tap" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Lint
        run: sh scripts/lint.sh

      - name: Run tests
        run: go test -race ./...

      - name: Run CLI end-to-end tests
        run: go test -tags=e2e ./tests/e2e -v

      - name: Run isolated process end-to-end tests
        run: ./tests/e2e/test-process-cleanup.sh

      - name: Run release script tests
        run: bash tests/scripts/release_test.sh

      - name: Run security scans
        run: sh scripts/security.sh

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: release --snapshot --clean --skip=sign

      - name: Verify snapshot
        run: sh scripts/verify-homebrew-cask.sh

  homebrew-cask:
    name: Homebrew Cask Smoke Test
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: release --snapshot --clean --skip=sign

      - name: Install generated cask
        run: sh tests/scripts/homebrew_cask_test.sh

  build:
    name: Build Signed Assets
    needs: [preflight, homebrew-cask]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Build and upload draft assets
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save generated Homebrew cask
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-pk-${{ inputs.tag_name }}
          path: dist/homebrew/Casks/pk.rb
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Verify and Publish Draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          mkdir assets
          gh release download "$TAG_NAME" --dir assets --pattern 'pk-*' --pattern 'SHA256SUMS*'

      - name: Verify assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
          test "$is_draft" = "true"
          test -s assets/pk-darwin-amd64
          test -s assets/pk-darwin-arm64
          test -s assets/pk-linux-amd64
          test -s assets/pk-linux-arm64
          test -s assets/SHA256SUMS
          test -s assets/SHA256SUMS.bundle
          cd assets
          sha256sum --check SHA256SUMS

      - name: Verify checksum signature
        run: sh scripts/verify-checksum-signature.sh assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$TAG_NAME" == *-* ]]; then
            gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest
          fi

  update-homebrew:
    name: Update Homebrew
    if: ${{ !contains(inputs.tag_name, '-') }}
    needs: publish
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ inputs.tag_name }}
      artifact_name: homebrew-pk-${{ inputs.tag_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  restore-draft:
    name: Restore Draft After Homebrew Failure
    if: >-
      ${{
        always() &&
        needs.publish.result == 'success' &&
        needs.update-homebrew.result == 'failure'
      }}
    needs: [publish, update-homebrew]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Restore draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=true --latest=false
