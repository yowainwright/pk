name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 2"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard and publish results
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.1
        with:
          sarif_file: results.sarif
