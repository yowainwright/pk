name: Update Homebrew Cask

on:
  workflow_call:
    inputs:
      tag_name:
        description: Published stable release tag
        required: true
        type: string
      artifact_name:
        description: Generated cask artifact from the caller
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published stable release tag
        required: true
        type: string

permissions: {}

concurrency:
  group: update-homebrew-pk
  cancel-in-progress: false

jobs:
  update-cask:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate stable tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG_NAME" =~ $pattern ]]; then
            echo "tag_name must be a stable v-prefixed semantic version" >&2
            exit 1
          fi

      - name: Download cask from caller
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_name }}
          path: generated

      - name: Find release artifact
        if: ${{ inputs.artifact_name == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          artifact_name="homebrew-pk-$TAG_NAME"
          endpoint="repos/$GITHUB_REPOSITORY/actions/artifacts"
          query='.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .id'
          artifact_id="$(gh api --method GET "$endpoint" -f name="$artifact_name" --jq "$query")"
          if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
            echo "No retained cask artifact found for $TAG_NAME" >&2
            exit 1
          fi
          gh api "$endpoint/$artifact_id/zip" > artifact.zip
          mkdir generated
          unzip -q artifact.zip -d generated

      - name: Verify generated cask
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          cask_file="generated/pk.rb"
          version="${TAG_NAME#v}"
          test -s "$cask_file"
          ruby -c "$cask_file"
          grep -Fq "version \"$version\"" "$cask_file"
          grep -Fq "/releases/download/$TAG_NAME/" "$cask_file"

      - name: Verify tap credentials
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          can_push="$(gh api repos/yowainwright/homebrew-tap --jq '.permissions.push')"
          if [[ "$can_push" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot update yowainwright/homebrew-tap" >&2
            exit 1
          fi

      - name: Install released cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          brew install --cask "$PWD/generated/pk.rb"
          test "$(pk --version)" = "pk $TAG_NAME"
          brew uninstall --cask pk

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: yowainwright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          mkdir -p tap/Casks
          cp generated/pk.rb tap/Casks/pk.rb
          git -C tap rm --ignore-unmatch Formula/pk.rb
          ruby -c tap/Casks/pk.rb

      - name: Commit and push
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/pk.rb
          if git -C tap diff --cached --quiet; then
            exit 0
          fi
          git -C tap commit -m "Update pk to $version"
          git -C tap push
