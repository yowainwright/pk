name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Unformatted files:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Lint
        run: sh scripts/lint.sh

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

      - name: Test
        run: |
          go test -race -covermode=atomic \
            -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Test shell scripts
        run: |
          bash tests/scripts/release_test.sh
          bash tests/scripts/setup_test.sh

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.out
          flags: unit
          name: unit
          use_oidc: true

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run security scans
        run: sh scripts/security.sh

  cli-e2e:
    name: CLI E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run CLI end-to-end tests
        run: go test -tags=e2e ./tests/e2e -v

  process-e2e:
    name: Isolated Process E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Run isolated process end-to-end tests
        run: ./tests/e2e/test-process-cleanup.sh

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"
          cache: true

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.0
          args: release --snapshot --clean --skip=sign

      - name: Verify generated cask
        run: sh scripts/verify-homebrew-cask.sh
