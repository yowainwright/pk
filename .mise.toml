[tools]
go = "1.26.5"
goreleaser = "2.17.0"
shellcheck = "0.11.0"

[tools."github:yowainwright/shellcheck_legibility"]
version = "0.2.1"
asset_pattern = "shellcheck-legibility-0.2.1.tar.gz"
checksum = "sha256:137942db1000e72ce8f8e2fbe8c10e334c70dc554ad2ef08aa49f0778f0302c0"
strip_components = 1
bin_path = "bin"

[env]
GOFLAGS = "-mod=readonly"

[tasks.build]
description = "Build pk"
run = "CGO_ENABLED=0 go build -trimpath -o bin/pk ./cmd/pk"

[tasks.fmt]
description = "Format Go code"
run = "gofmt -w ."

[tasks.fmt-check]
description = "Check Go formatting"
run = '''
files="$(gofmt -l .)"
test -z "$files" || {
  printf 'Run mise run fmt for:\n%s\n' "$files" >&2
  exit 1
}
'''

[tasks.setup]
description = "Install lint tools and repository Git and agent hooks"
run = "sh scripts/setup.sh"

[tasks.hook-pre-commit]
description = "Run fast commit checks"
run = '''
mise run fmt-check
mise run lint
go test ./...
'''

[tasks.lint]
description = "Check correctness and report readability findings on changed files"
run = "sh scripts/lint.sh"

[tasks.lint-agent]
description = "Run strict changed-file lint for agent edits"
run = "sh scripts/lint.sh --agent"

[tasks."lint/session"]
description = "Enforce shell and Go style before an agent finishes"
run = "sh scripts/lint-session.sh"

[tasks.lint-all]
description = "Run lint checks with all-file legibility reporting"
run = "sh scripts/lint.sh --all"

[tasks.lint-agent-all]
description = "Run strict lint for all shell scripts and Go packages"
run = "sh scripts/lint.sh --agent --all"

[tasks.lint-legibility-setup]
description = "Build the custom Go legibility linter"
run = "sh scripts/lint.sh --setup-only"

[tasks.test]
description = "Run race-enabled tests"
run = "go test -race ./..."

[tasks.test-e2e]
description = "Run CLI end-to-end tests"
run = "go test -tags=e2e ./tests/e2e -v"

[tasks.test-process-e2e]
description = "Run isolated process cleanup tests"
run = "./tests/e2e/test-process-cleanup.sh"

[tasks.test-scripts]
description = "Run shell script tests"
run = '''
bash tests/scripts/release_test.sh
bash tests/scripts/setup_test.sh
bash tests/scripts/lint_test.sh
'''

[tasks.security]
description = "Run vulnerability and source security scans"
run = "sh scripts/security.sh"

[tasks.release-check]
description = "Validate GoReleaser configuration"
run = "goreleaser check"

[tasks.release-snapshot]
description = "Build release artifacts without publishing"
run = "goreleaser release --snapshot --clean --skip=sign"

[tasks.release-verify]
description = "Verify snapshot assets and Homebrew cask"
run = "sh scripts/verify-homebrew-cask.sh"

[tasks.test-homebrew-cask]
description = "Install the generated cask from local artifacts"
run = "sh tests/scripts/homebrew_cask_test.sh"

[tasks.check]
description = "Run local code checks"
run = '''
mise run fmt-check
mise run lint
mise run test
mise run test-scripts
'''

[tasks.release-preview]
description = "Validate the complete release without publishing"
run = '''
mise run check
mise run test-e2e
mise run test-process-e2e
mise run security
mise run release-check
mise run release-snapshot
mise run release-verify
if [ "$(uname -s)" = "Darwin" ]; then
  mise run test-homebrew-cask
fi
'''

[tasks.release]
description = "Select, validate, and dispatch a v0 release"
run = "bash scripts/release.sh"
