# Commands: README.md
only_rules:
  - closure_body_length
  - contains_over_filter_count
  - cyclomatic_complexity
  - function_body_length
  - function_parameter_count
  - unneeded_break_in_switch

included:
  - Widget/Widget
  - Widget/PKStats
  - Widget/PKStatsTests

excluded:
  - .build
  - build
  - DerivedData

closure_body_length:
  warning: 20
  error: 20

contains_over_filter_count:
  severity: error

cyclomatic_complexity:
  warning: 10
  error: 10

function_body_length:
  warning: 20
  error: 20

function_parameter_count:
  warning: 5
  error: 5
  ignores_default_parameters: false

unneeded_break_in_switch:
  severity: error
