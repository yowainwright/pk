version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: pk
    main: ./cmd/pk
    binary: pk
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: pk
    formats: [binary]
    name_template: "pk-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    signature: ${artifact}.bundle

release:
  draft: true
  replace_existing_artifacts: true
  mode: keep-existing
  prerelease: auto
  make_latest: false

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
